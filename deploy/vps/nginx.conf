# Nginx site for Content Machine (see docs/getting-started/vps.md).
# Copy to /etc/nginx/sites-available/content-machine, replace
# cm.example.com with your domain, link it into sites-enabled, then run
# certbot --nginx to add HTTPS (Telegram webhooks require HTTPS).

server {
    listen 80;
    listen [::]:80;
    server_name cm.example.com;

    root /var/www/content-machine/public;
    index index.php;

    charset utf-8;
    # Voice notes and photos uploaded from the dashboard.
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
