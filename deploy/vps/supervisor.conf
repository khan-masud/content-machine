; Queue workers for a single small VPS (see docs/getting-started/vps.md).
; Copy to /etc/supervisor/conf.d/content-machine.conf, then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Two workers keep memory low on a 2 GB machine:
; - scratchpad: Telegram drafts, voice notes, photo cards, Facebook publishing
; - default: everything else
; --max-jobs/--max-time restart each worker regularly so PHP memory never
; creeps up. Timeouts match deploy/docker (AI image calls can be slow).

[program:cm-scratchpad]
command=php /var/www/content-machine/artisan queue:work --queue=scratchpad --tries=3 --backoff=10,60,300 --timeout=900 --max-time=3600 --max-jobs=200 --sleep=2 --memory=256
user=www-data
directory=/var/www/content-machine
autostart=true
autorestart=true
stopsignal=SIGTERM
stopwaitsecs=960
stdout_logfile=/var/log/content-machine/scratchpad.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:cm-default]
command=php /var/www/content-machine/artisan queue:work --queue=default --tries=3 --backoff=10,60,300 --timeout=900 --max-time=3600 --max-jobs=200 --sleep=2 --memory=256
user=www-data
directory=/var/www/content-machine
autostart=true
autorestart=true
stopsignal=SIGTERM
stopwaitsecs=960
stdout_logfile=/var/log/content-machine/default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

; Only needed if you also publish through PostSyncer. Uncomment, then
; reread/update supervisor.
;[program:cm-postsyncer]
;command=php /var/www/content-machine/artisan queue:work postsyncer --queue=postsyncer --tries=3 --backoff=10,60,300 --timeout=900 --max-time=3600 --max-jobs=200 --sleep=2 --memory=256
;user=www-data
;directory=/var/www/content-machine
;autostart=true
;autorestart=true
;stopsignal=SIGTERM
;stopwaitsecs=960
;stdout_logfile=/var/log/content-machine/postsyncer.log
;stdout_logfile_maxbytes=10MB
;redirect_stderr=true
